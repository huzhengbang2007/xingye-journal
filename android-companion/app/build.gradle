plugins { id 'com.android.application' }
def appMetadata = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def appVersion = appMetadata.version
android {
    namespace 'cn.xingyeji.companion'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'cn.xingyeji.companion'; minSdk 26; targetSdk 35; versionCode appMetadata.androidVersionCode as int; versionName appVersion }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('.signing/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    signingConfigs {
        release {
            if (System.getenv('XINGYE_KEYSTORE')) {
                storeFile file(System.getenv('XINGYE_KEYSTORE'))
                storePassword System.getenv('XINGYE_STORE_PASSWORD')
                keyAlias System.getenv('XINGYE_KEY_ALIAS')
                keyPassword System.getenv('XINGYE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { debuggable false; minifyEnabled true; shrinkResources true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
    }
}

android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/web-assets'))
tasks.register('syncWebAssets', Sync) { from rootProject.file('../public'); into layout.buildDirectory.dir('generated/web-assets/www') }
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
tasks.configureEach { task ->
    if (task.name == 'validateSigningRelease') {
        doFirst {
            ['XINGYE_KEYSTORE', 'XINGYE_STORE_PASSWORD', 'XINGYE_KEY_ALIAS', 'XINGYE_KEY_PASSWORD'].each {
                if (!System.getenv(it)) throw new GradleException("Release signing requires ${it}; debug builds are for local testing only.")
            }
        }
    }
}

dependencies {
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    // CaptureManager uses these classes; ZXing's POM omits this runtime dependency.
    implementation "androidx.core:core:1.13.0"
}
