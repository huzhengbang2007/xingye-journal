name: Source checks
on: [push, pull_request]
jobs:
  node:
    runs-on: windows-latest
    strategy:
      matrix:
        node: ['22', '24.22.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npx playwright-core install chromium
      - run: npm run test:browser
      - run: npm run test:offline
      - run: npm run test:appearance
      - run: npm run test:import
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'zxing-core-3.4.1.jar'
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/com/google/zxing/core/3.4.1/core-3.4.1.jar' -OutFile $jar
          if ((Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash -ne 'ACFA30338C26267B6CAB665509C2251BB96E8350BFCAD89D59B949BA77011F8D') { throw 'ZXing checksum mismatch' }
      - run: npm run test:devices
        env:
          ZXING_CORE_JAR: '${{ runner.temp }}\zxing-core-3.4.1.jar'
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --manifest-path native/Cargo.toml -p xingye-vault --locked
      - run: cargo build --manifest-path native/Cargo.toml --workspace --release --locked
      - run: npm run test:rust
        env:
          XINGYE_TEST_VAULT_HELPER: '${{ github.workspace }}\native\target\release\xingye-vault.exe'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: mkdir -p android-companion/.signing && keytool -genkeypair -keystore android-companion/.signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=CI Test' -keyalg RSA -validity 30
      - run: gradle -p android-companion assembleDebug lintDebug --no-daemon
      - run: java android-companion/checks/ApkLinkageCheck.java android-companion/app/build/outputs/apk/debug/app-debug.apk --scanner-core-only
      - run: |
          mkdir -p tmp/auth-check
          javac -encoding UTF-8 -d tmp/auth-check android-companion/app/src/main/java/cn/xingyeji/companion/AuthorizationGate.java android-companion/checks/AuthorizationGateCheck.java
          java -cp tmp/auth-check cn.xingyeji.companion.AuthorizationGateCheck
